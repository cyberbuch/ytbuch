name: Публикуване на сайта в GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Само файловете на сайта — markdown документацията не се публикува.
      - name: Сглобяване на сайта
        run: |
          mkdir -p _site/assets
          cp docs/*.html docs/CNAME docs/favicon.ico docs/apple-touch-icon.png _site/
          cp docs/assets/* _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
